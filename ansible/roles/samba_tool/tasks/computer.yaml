---
# Computer account operations.
#   read-only : list, show -> samba_directory_info (addcctl)
#   mutating  : create, delete/absent -> the samba_computer module (addcctl)

- name: Validate computer action
  ansible.builtin.assert:
    that: samba_tool_action in _samba_tool_computer_actions
    fail_msg: >-
      Unsupported computer action '{{ samba_tool_action }}'.
      Valid: {{ _samba_tool_computer_actions }}.
    quiet: true
  vars:
    _samba_tool_computer_actions:
      - list
      - show
      - create
      - delete
      - absent

- name: Read-only computer operations (samba_directory_info, on addcctl)
  when: samba_tool_action in ['list', 'show']
  ansible.builtin.include_tasks: _info.yaml

- name: Computer account present or absent (samba_computer, on addcctl)
  when: samba_tool_action in ['create', 'delete', 'absent']
  lineadicomando.samba_dc.samba_computer:
    name: "{{ samba_tool_args.name }}"
    state: "{{ 'absent' if samba_tool_action in ['delete', 'absent'] else 'present' }}"
    ou: "{{ samba_tool_args.ou | default(omit) }}"
    description: "{{ samba_tool_args.description | default(omit) }}"
