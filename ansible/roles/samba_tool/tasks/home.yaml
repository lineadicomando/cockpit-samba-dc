---
# Home directory of a domain user, through the samba_home module (addcctl),
# the same as cockpit-samba-dc does.
#
# Actions:
#   provision : /srv/samba/home/<name>, owned by the user and its login group
#               (mode 0700), homeDrive and homeDirectory, the "home" share
#   absent    : clear the attributes and remove the folder
#
# Args:
#   name       : sAMAccountName of the user (required)
#   home_drive : drive letter (default H:)
#   home_base, share_name: only their defaults, /srv/samba/home and home,
#                which addcctl manages; home_group is no longer used (the
#                folder's group is the user's login group)

- name: Validate home action
  ansible.builtin.assert:
    that: samba_tool_action in ['provision', 'absent']
    fail_msg: >-
      Unsupported home action '{{ samba_tool_action }}'.
      Valid: provision, absent.
    quiet: true

- name: Validate the home location
  ansible.builtin.assert:
    that:
      - (samba_tool_args.home_base | default('/srv/samba/home')) | regex_replace('/+$', '') == '/srv/samba/home'
      - (samba_tool_args.share_name | default('home')) == 'home'
    fail_msg: >-
      home_base can only be /srv/samba/home and share_name only home: addcctl
      manages the home directories there.
    quiet: true

- name: "Home directory: {{ samba_tool_action }}"
  lineadicomando.samba_dc.samba_home:
    name: "{{ samba_tool_args.name }}"
    state: "{{ 'present' if samba_tool_action == 'provision' else 'absent' }}"
    drive: "{{ samba_tool_args.home_drive | default('H:') }}"
    delete_data: "{{ samba_tool_action == 'absent' }}"
