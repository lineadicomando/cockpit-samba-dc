---
# Group operations.
#   read-only : list, listmembers, show
#   mutating  : add/create, delete/absent, addmembers, removemembers
#               -> the samba_group module (addcctl)

- name: Validate group action
  ansible.builtin.assert:
    that: samba_tool_action in _samba_tool_group_actions
    fail_msg: >-
      Unsupported group action '{{ samba_tool_action }}'.
      Valid: {{ _samba_tool_group_actions }}.
    quiet: true
  vars:
    _samba_tool_group_actions:
      - list
      - listmembers
      - show
      - add
      - create
      - delete
      - absent
      - addmembers
      - removemembers

- name: Read-only group operations
  when: samba_tool_action in ['list', 'listmembers', 'show']
  block:
    - name: Build argv for group {{ samba_tool_action }}
      ansible.builtin.set_fact:
        _samba_tool_argv: >-
          {{ ['group', samba_tool_action]
             + ([samba_tool_args.name] if samba_tool_action != 'list' else []) }}

    - name: Run read-only group command
      ansible.builtin.include_tasks: _run.yaml

- name: Group present or absent (samba_group, on addcctl)
  when: samba_tool_action in ['add', 'create', 'delete', 'absent']
  lineadicomando.samba_dc.samba_group:
    name: "{{ samba_tool_args.name }}"
    state: "{{ 'absent' if samba_tool_action in ['delete', 'absent'] else 'present' }}"
    description: "{{ samba_tool_args.description | default(omit) }}"
    scope: "{{ samba_tool_args.scope | default(omit) }}"
    category: "{{ samba_tool_args.category | default(omit) }}"
    ou: "{{ samba_tool_args.ou | default(omit) }}"

# Only the delta is applied, compared case-insensitively as AD does; the
# group must exist.
- name: Group membership (samba_group, on addcctl)
  when: samba_tool_action in ['addmembers', 'removemembers']
  lineadicomando.samba_dc.samba_group:
    name: "{{ samba_tool_args.name }}"
    create: false
    members: >-
      {{ samba_tool_args.members
         if (samba_tool_args.members is sequence and samba_tool_args.members is not string)
         else samba_tool_args.members.split(',') | map('trim') | list }}
    members_mode: "{{ 'append' if samba_tool_action == 'addmembers' else 'remove' }}"
