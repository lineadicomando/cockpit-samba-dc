---
# Self-describing catalog for the `samba` MCP tool.
# Lists the manageable objects, the supported actions and the expected arguments.
display_name: Samba AD DC
notes: >-
  Runs on the domain controller with elevated privileges. Read-only actions
  (list, show, ...) never change state. Mutating actions on users are
  idempotent via the samba_tool_user module; group/computer/ou reconcile state
  before acting. args.name is required for every action except list.
  Use preview for destructive actions (delete, disable, removemembers, revoke).

objects:
  user:
    description: Domain users (sAMAccountName).
    actions:
      list: { args: [], readonly: true }
      show: { args: [name], readonly: true }
      create:
        args: [name, password, given_name, surname, mail, description, job_title, department, company, ou, must_change_password, primary_group]
        destructive: false
      present: { args: [name, password, primary_group], destructive: false }
      delete: { args: [name], destructive: true }
      absent: { args: [name], destructive: true }
      enable: { args: [name], destructive: false }
      disable: { args: [name], destructive: true }
      setpassword: { args: [name, password], destructive: true }
      setprimarygroup: { args: [name, primary_group], destructive: false }
  group:
    description: Security/distribution groups.
    actions:
      list: { args: [], readonly: true }
      show: { args: [name], readonly: true }
      listmembers: { args: [name], readonly: true }
      add: { args: [name], destructive: false }
      create: { args: [name], destructive: false }
      delete: { args: [name], destructive: true }
      absent: { args: [name], destructive: true }
      addmembers: { args: [name, members], destructive: false }
      removemembers: { args: [name, members], destructive: true }
  computer:
    description: Computer accounts.
    actions:
      list: { args: [], readonly: true }
      show: { args: [name], readonly: true }
      create: { args: [name], destructive: false }
      delete: { args: [name], destructive: true }
      absent: { args: [name], destructive: true }
  ou:
    description: Organizational units (DN relative to the domain base, e.g. "OU=Staff").
    actions:
      list: { args: [], readonly: true }
      listobjects: { args: [name], readonly: true }
      create: { args: [name], destructive: false }
      delete: { args: [name], destructive: true }
      absent: { args: [name], destructive: true }
  home:
    description: >-
      Home directory provisioning for a domain user. Replicates the logic of
      cockpit-samba-dc: creates the physical directory, sets homeDrive /
      homeDirectory LDAP attributes via ldbmodify, and ensures the SMB share.
    actions:
      provision:
        args: [name, home_base, home_drive, share_name, home_group]
        destructive: false
        note: >-
          name is required (sAMAccountName). home_base defaults to /srv/samba/home,
          home_drive to H:, share_name to home, home_group to "Domain Users".
          The SMB share is created only if missing; its parameters are then
          reconciled. Requires the account to be resolvable through NSS.
      absent:
        args: [name, home_base]
        destructive: true
        note: Removes the physical directory and clears the LDAP attributes.
  share:
    description: >-
      Shared folders for domain users and groups, in the model of
      cockpit-samba-dc: a registry share under /srv/samba/shares/<name>,
      access enforced by valid users/read list and a POSIX ACL on the folder
      tree, optionally mapped as a network drive at logon through the
      "Cockpit - Mapped drives" GPO. Shares created here and in Cockpit are
      interchangeable; shares outside /srv/samba/shares are never touched.
      Access: args.access is a list of {name, kind (user|group, read from the
      directory when omitted), level (read|write, default read)}; args.read and
      args.write are shorthands taking lists of names.
    actions:
      list: { args: [], readonly: true }
      show: { args: [name], readonly: true }
      create:
        args: [name, access, read, write, comment, browseable, drive_letter, drive_label]
        destructive: false
        note: >-
          Creates the share or converges an existing one. The given access list
          replaces the current one; omit it to keep the current access.
          drive_letter is E-Z except H (home directories); "" removes the
          mapping; omitted keeps the current one. drive_label defaults to the
          share name. comment "" removes the comment.
      present:
        args: [name, access, read, write, comment, browseable, drive_letter, drive_label]
        destructive: false
        note: Same as create.
      grant:
        args: [name, access, read, write]
        destructive: false
        note: Adds the listed users/groups, or changes their level; others are kept.
      revoke:
        args: [name, access, read, write]
        destructive: true
        note: >-
          Removes the listed users/groups (their level is ignored). A share
          must keep at least one user or group.
      delete:
        args: [name, delete_data]
        destructive: true
        note: >-
          Removes the share and its drive mapping. The folder is kept on disk
          unless delete_data is true.
      absent:
        args: [name, delete_data]
        destructive: true
        note: Same as delete.
