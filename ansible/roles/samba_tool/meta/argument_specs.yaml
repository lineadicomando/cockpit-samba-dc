---
argument_specs:
  main:
    short_description: Manage the objects of a Samba AD DC
    description:
      - Entry point for the samba_tool role. Dispatches an action against an
        object (user, group, computer), provisions a user home directory or
        manages a shared folder.
      - Domain backup and restore live in the separate samba_dc_backup role.
    options:
      samba_tool_object:
        description: The kind of object to act upon.
        type: str
        required: true
        choices: [user, group, computer, home, share]
      samba_tool_action:
        description: The action to run (e.g. create, delete, list, show, addmembers).
        type: str
        required: true
      samba_tool_args:
        description:
          - Action-specific arguments (name, password, members, ...).
          - C(name) is required for every action except C(list).
        type: dict
        default: {}
      samba_tool_shares_dir:
        description:
          - Directory holding the shared folders managed by O(samba_tool_object=share).
          - Must match the one used by cockpit-samba-dc for the two to manage
            the same shares.
        type: path
        default: /srv/samba/shares
      samba_tool_no_log:
        description: Hide output of tasks that may contain passwords.
        type: bool
        default: true
