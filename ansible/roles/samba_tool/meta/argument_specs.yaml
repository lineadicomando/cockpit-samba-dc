---
argument_specs:
  main:
    short_description: Manage a Samba AD DC object via samba-tool
    description:
      - Entry point for the samba_tool role. Dispatches an action against an
        object (user, group, computer, ou), provisions a user home directory or
        manages a shared folder.
      - Domain backup and restore live in the separate samba_dc_backup role.
    options:
      samba_tool_object:
        description: The kind of object to act upon.
        type: str
        required: true
        choices: [user, group, computer, ou, home, share]
      samba_tool_action:
        description: The samba-tool verb to run (e.g. create, delete, list, show, addmembers).
        type: str
        required: true
      samba_tool_args:
        description:
          - Action-specific arguments (name, password, members, ...).
          - C(name) is required for every action except C(list).
        type: dict
        default: {}
      samba_tool_bin:
        description: Path to the samba-tool executable on the target.
        type: str
        default: samba-tool
      samba_tool_sam_ldb_path:
        description:
          - Samba directory database, used by C(ldbmodify) for the attributes
            samba-tool cannot set (primaryGroupID, homeDrive, homeDirectory).
        type: path
        default: /var/lib/samba/private/sam.ldb
      samba_tool_home_share_params:
        description:
          - Parameters enforced on the home SMB share by
            O(samba_tool_object=home) with O(samba_tool_action=provision).
        type: list
        elements: dict
        options:
          param:
            description: smb.conf parameter name.
            type: str
            required: true
          value:
            description: Value the parameter must have.
            type: str
            required: true
      samba_tool_shares_dir:
        description:
          - Directory holding the shared folders managed by O(samba_tool_object=share).
          - Must match the one used by cockpit-samba-dc for the two to manage
            the same shares.
        type: path
        default: /srv/samba/shares
      samba_tool_no_log:
        description: Hide output of tasks that may contain passwords.
        type: bool
        default: true
