---
# The current password cannot be read back from the directory, so a marker file
# records that the initial password has been applied. samba.yaml removes the
# marker when it re-provisions the domain.
- name: Check if Administrator password has already been set
  ansible.builtin.stat:
    path: /var/lib/samba/.administrator_password_set
  register: samba_dc_build_admin_passwd_set

- name: Set Administrator password
  lineadicomando.samba_dc.samba_user:
    name: Administrator
    password: "{{ samba_dc_build_administrator_passwd }}"
    update_password: always
  no_log: true
  when: not samba_dc_build_admin_passwd_set.stat.exists

- name: Mark Administrator password as set
  ansible.builtin.file:
    path: /var/lib/samba/.administrator_password_set
    state: touch
    owner: root
    group: root
    mode: "0600"
  when: not samba_dc_build_admin_passwd_set.stat.exists
