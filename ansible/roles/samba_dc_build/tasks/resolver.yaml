---
# Switching the DC to resolve through itself must happen only once the internal
# DNS is actually answering: samba-ad-dc is installed, provisioned and started,
# and smb.conf carries the forwarder. Doing it earlier (as part of the interface
# configuration) leaves the host with a resolver that nothing is listening on,
# and every later apt or git operation fails with no name resolution.
- name: Stop and mask systemd-resolved (incompatible with Samba AD DC DNS)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
    masked: true
  failed_when: false

- name: Check the status of /etc/resolv.conf
  ansible.builtin.stat:
    path: /etc/resolv.conf
    follow: false # important to detect whether it is a symlink
  register: samba_dc_build_resolv_status

# Only the systemd-resolved symlink needs removing. Removing the file
# unconditionally would make this role report changed — and notify a reboot —
# on every single run.
- name: Remove /etc/resolv.conf if it is a symlink
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when:
    - samba_dc_build_resolv_status.stat.exists
    - samba_dc_build_resolv_status.stat.islnk

- name: Set /etc/resolv.conf
  ansible.builtin.copy:
    dest: "/etc/resolv.conf"
    content: |
      search {{ samba_dc_build_search_domain }}
      nameserver {{ samba_dc_build_nameserver }}
    owner: root
    group: root
    mode: "0644"
  notify: samba_dc reboot
