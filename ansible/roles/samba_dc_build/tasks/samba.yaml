---
# Only the packages: addcctl stops, masks and replaces the standalone server
# they start (smbd, nmbd, winbind) when it provisions the domain.
- name: Install Samba and dependencies without interaction
  ansible.builtin.apt:
    update_cache: true
    name:
      - samba
      - samba-ad-dc
      - winbind
      - libnss-winbind
      - krb5-user
      - smbclient
      - ldb-tools
      - python3-cryptography
    state: present
    install_recommends: true
    force_apt_get: true
  environment:
    DEBIAN_FRONTEND: noninteractive
