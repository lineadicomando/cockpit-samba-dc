---
- name: Assert required variables
  ansible.builtin.import_tasks: assert.yaml

- name: System setup
  ansible.builtin.import_tasks: system.yaml

- name: Bash customizations
  ansible.builtin.import_tasks: bash.yaml

# Network first: addcctl registers the address of the interface of the
# default route in the internal DNS zone, and refuses a DHCP address.
- name: Network configuration
  ansible.builtin.import_tasks: network.yaml

# The static address of network.yaml (and the OS upgrade) take effect with
# the reboot: before the provisioning, which reads the address from the host.
- name: Apply pending reboot before provisioning
  ansible.builtin.meta: flush_handlers

- name: Samba packages
  ansible.builtin.import_tasks: samba.yaml

# addcctl before the provisioning, which it runs, and before the accounts
# below, which the collection's modules manage through it
- name: Install cockpit-samba-dc (addcctl and the Cockpit page)
  ansible.builtin.import_tasks: cockpit_samba_dc.yaml

- name: Samba domain provisioning
  ansible.builtin.import_tasks: provision.yaml

- name: Firewall configuration
  ansible.builtin.import_tasks: firewall.yaml

- name: Services activation
  ansible.builtin.import_tasks: services.yaml

# Apply the pending reboot (smb.conf of an existing DC) before touching the
# directory, so that account management runs against a settled DC.
- name: Apply pending reboot before managing directory objects
  ansible.builtin.meta: flush_handlers

- name: Passwords
  ansible.builtin.import_tasks: passwords.yaml

- name: Admin user
  ansible.builtin.import_tasks: admin_user.yaml
