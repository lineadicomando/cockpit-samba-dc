---
# Idempotency comes from the directory itself, not from a marker file: the
# module checks whether the account exists and the membership is reconciled
# against the current member list.
- name: Create admin user
  lineadicomando.samba_dc.samba_tool_user:
    name: "{{ samba_dc_build_administrator_username }}"
    password: "{{ samba_dc_build_administrator_passwd }}"
    state: present
    enabled: true
    update_password: on_create
  no_log: true

- name: Read the current members of Domain Admins
  ansible.builtin.command:
    argv: [samba-tool, group, listmembers, Domain Admins]
  register: samba_dc_build_domain_admins
  changed_when: false

- name: Add admin user to Domain Admins
  ansible.builtin.command:
    argv: [samba-tool, group, addmembers, Domain Admins, "{{ samba_dc_build_administrator_username }}"]
  when: >-
    samba_dc_build_administrator_username | lower
    not in (samba_dc_build_domain_admins.stdout_lines | map('lower') | list)
  changed_when: true
