---
# Idempotency comes from the directory itself, not from a marker file:
# samba_user creates the account only when it is missing and adds it to
# Domain Admins only when it is not a member.
- name: Admin user, member of Domain Admins
  lineadicomando.samba_dc.samba_user:
    name: "{{ samba_dc_build_administrator_username }}"
    password: "{{ samba_dc_build_administrator_passwd }}"
    update_password: on_create
    enabled: true
    groups: [Domain Admins]
    groups_mode: append
  no_log: true
