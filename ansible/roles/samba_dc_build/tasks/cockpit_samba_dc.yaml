---
# cockpit-samba-dc, the project this collection belongs to: addcctl, the core
# the modules call, and the Cockpit page. package: both from the Debian
# packages of a release, checksum verified (default); none: addcctl alone;
# source: both built from a git revision on the DC, for development.
- name: Check the cockpit-samba-dc install mode
  ansible.builtin.assert:
    that:
      - samba_dc_build_cockpit_install in ['package', 'source', 'none']
      - samba_dc_build_cockpit_install == 'source'
        or samba_dc_build_cockpit_package_files | default([], true) | length > 0
        or samba_dc_build_cockpit_version is match('^\d+\.\d+\.\d+$')
    fail_msg: >-
      samba_dc_build_cockpit_install must be package, source or none (current:
      {{ samba_dc_build_cockpit_install }}). With package or none,
      samba_dc_build_cockpit_version is a release version, X.Y.Z (current:
      {{ samba_dc_build_cockpit_version }}); a git revision goes into
      samba_dc_build_cockpit_source_version, with samba_dc_build_cockpit_install: source.
    quiet: true

# addcctl, the core the modules of this collection call, always; the Cockpit
# page with package. In this order: the page depends on addcctl of its version.
- name: Install the Debian packages of the release
  when: samba_dc_build_cockpit_install in ['package', 'none']
  vars:
    samba_dc_build_cockpit_packages: >-
      {{ ['addcctl'] + (['cockpit-samba-dc'] if samba_dc_build_cockpit_install == 'package' else []) }}
    samba_dc_build_cockpit_local: "{{ samba_dc_build_cockpit_package_files | default([], true) | length > 0 }}"
  block:
    - name: Directory for the packages
      ansible.builtin.file:
        path: "{{ samba_dc_build_cockpit_package_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the packages of the release, checked against their .sha256
      ansible.builtin.get_url:
        url: "{{ samba_dc_build_cockpit_release_url }}/{{ item }}_{{ samba_dc_build_cockpit_version }}_all.deb"
        dest: "{{ samba_dc_build_cockpit_package_dir }}/{{ item }}_{{ samba_dc_build_cockpit_version }}_all.deb"
        checksum: "sha256:{{ samba_dc_build_cockpit_release_url }}/{{ item }}_{{ samba_dc_build_cockpit_version }}_all.deb.sha256"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ samba_dc_build_cockpit_packages }}"
      register: samba_dc_build_cockpit_download
      when: not samba_dc_build_cockpit_local

    - name: Copy the local packages
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ samba_dc_build_cockpit_package_dir }}/{{ item | basename }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ samba_dc_build_cockpit_package_files | default([], true) }}"
      register: samba_dc_build_cockpit_copy
      when: samba_dc_build_cockpit_local

    # apt compares each package's version with the installed one, so a rerun
    # of the same release changes nothing. cockpit-samba-dc removes a copy
    # installed by hand under /usr/share/cockpit/samba-dc (its preinst).
    - name: Install the packages
      ansible.builtin.apt:
        deb: "{{ samba_dc_build_cockpit_package_dir }}/{{ item }}"
      loop: >-
        {{ (samba_dc_build_cockpit_package_files | map('basename') | sort | list)
           if samba_dc_build_cockpit_local
           else (samba_dc_build_cockpit_packages
                 | map('regex_replace', '$', '_' ~ samba_dc_build_cockpit_version ~ '_all.deb') | list) }}

    - name: Remove the working copy of a former build from source
      ansible.builtin.file:
        path: "{{ samba_dc_build_cockpit_src }}"
        state: absent

- name: Build cockpit-samba-dc from source
  when: samba_dc_build_cockpit_install == 'source'
  block:
    - name: Install cockpit-samba-dc build dependencies
      ansible.builtin.apt:
        name:
          - git
          - nodejs
          - npm
          - make
        state: present

    # make install writes where the packages would: the two must not mix.
    - name: Remove the packages before installing from source
      ansible.builtin.apt:
        name: [cockpit-samba-dc, addcctl]
        state: absent

    # Built as root from a remote repository: keep the working copy out of the
    # world-writable /tmp.
    - name: Directory for the cockpit-samba-dc working copy
      ansible.builtin.file:
        path: "{{ samba_dc_build_cockpit_src }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Clone cockpit-samba-dc repository
      ansible.builtin.git:
        repo: "{{ samba_dc_build_cockpit_repo }}"
        dest: "{{ samba_dc_build_cockpit_src }}"
        version: "{{ samba_dc_build_cockpit_source_version }}"
      register: samba_dc_build_cockpit_clone

    - name: Check whether the cockpit plugin is already installed
      ansible.builtin.stat:
        path: /usr/share/cockpit/samba-dc
      register: samba_dc_build_cockpit_installed

    # npm ci, not npm install: the latter rewrites package-lock.json, and the
    # next run then fails on a working copy with local modifications.
    - name: Install npm dependencies
      ansible.builtin.command:
        cmd: npm ci
        chdir: "{{ samba_dc_build_cockpit_src }}"
      when: samba_dc_build_cockpit_clone.changed or not samba_dc_build_cockpit_installed.stat.exists
      changed_when: true

    # Rebuild whenever the checkout moved: keying this on the installed path
    # alone would clone new revisions and never install them.
    - name: Build and install cockpit-samba-dc
      ansible.builtin.command:
        cmd: make install
        chdir: "{{ samba_dc_build_cockpit_src }}"
      when: samba_dc_build_cockpit_clone.changed or not samba_dc_build_cockpit_installed.stat.exists
      changed_when: true

# The plugin was called cockpit-samba-ad-dc until collection 0.4.0. Left in
# place, the old install shows up as a second entry in the Cockpit menu.
# Only once the new one is there, so that the DC is never left without one.
- name: Check that the plugin is installed under its current name
  ansible.builtin.stat:
    path: /usr/share/cockpit/samba-dc
  register: samba_dc_build_cockpit_current

- name: Remove the plugin installed under its former name
  ansible.builtin.file:
    path: /usr/share/cockpit/samba-ad-dc
    state: absent
  when: samba_dc_build_cockpit_current.stat.exists

- name: Remove the working copy of the plugin under its former name
  ansible.builtin.file:
    path: /usr/local/src/cockpit-samba-ad-dc
    state: absent
  when: samba_dc_build_cockpit_src | regex_replace('/+$', '') != '/usr/local/src/cockpit-samba-ad-dc'
