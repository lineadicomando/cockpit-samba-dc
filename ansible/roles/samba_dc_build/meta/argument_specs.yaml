---
argument_specs:
  main:
    short_description: Provision a Samba 4 AD Domain Controller on Debian Trixie
    description:
      - Configures static networking, installs Samba and cockpit-samba-dc
        (addcctl and the web UI), provisions a Samba 4 Active Directory
        Domain Controller through C(addcctl domain provision), and configures
        an nftables firewall and chrony as authoritative NTP source.
      - All host-specific options are mandatory and are normally supplied from
        host_vars. The role fails explicitly when one is missing.
    options:
      samba_dc_build_realm:
        description:
          - Kerberos realm in uppercase, e.g. EXAMPLE.COM; also the DNS domain
            of the DC, whose FQDN is its host name followed by the realm.
        type: str
        required: true
      samba_dc_build_domain:
        description: NetBIOS domain name, e.g. EXAMPLE.
        type: str
        required: true
      samba_dc_build_fqdn:
        description:
          - Fully qualified domain name of the DC, inside the search domain;
            the host name followed by the realm in lowercase, e.g. dc01.example.com.
        type: str
        required: true
      samba_dc_build_search_domain:
        description: DNS search domain, e.g. example.com.
        type: str
        required: true
      samba_dc_build_nameserver:
        description:
          - Nameserver of the interface configuration (C(dns-nameservers)).
            Once the domain is provisioned, the DC resolves through its own
            DNS (C(nameserver 127.0.0.1) in /etc/resolv.conf).
        type: str
        required: true
      samba_dc_build_address:
        description:
          - Static IPv4 address of the DC, on the interface of the default
            route. Applied (with a reboot) before the provisioning, which
            registers it in the internal DNS zone; the role fails if the
            address addcctl finds is a different one.
        type: str
        required: true
      samba_dc_build_netmask:
        description: Netmask of the static address, e.g. 255.255.255.0.
        type: str
        required: true
      samba_dc_build_gateway:
        description: Default gateway.
        type: str
        required: true
      samba_dc_build_dns_forwarder:
        description:
          - Upstream resolver the internal Samba DNS forwards non-authoritative
            queries to (C(dns forwarder) in smb.conf). Defaults to the gateway.
        type: str
        default: "{{ samba_dc_build_gateway }}"
      samba_dc_build_ifname:
        description: Name of the network interface to configure.
        type: str
        default: enp1s0
      samba_dc_build_ntp_server:
        description: Upstream NTP server chrony synchronizes with.
        type: str
        required: true
      samba_dc_build_ntp_allow_network:
        description: Network allowed to use the DC as NTP source, in CIDR notation.
        type: str
        required: true
      samba_dc_build_administrator_username:
        description: Name of the additional AD administrator account to create.
        type: str
        default: admin
      samba_dc_build_administrator_passwd:
        description:
          - Password for the AD administrator accounts. Required, with no
            default — supply it from a vault-encrypted variable.
        type: str
        required: true
      samba_dc_build_force_provision:
        description:
          - Force a destructive re-provisioning of an existing domain. The
            role stops Samba and removes its databases, sysvol and smb.conf,
            then addcctl provisions a new one. When false, provisioning is
            skipped as soon as a Samba database (sam.ldb) is found.
        type: bool
        default: false
      samba_dc_build_base_packages:
        description: Packages required by the DC and by Cockpit.
        type: list
        elements: str
      samba_dc_build_extra_packages:
        description: Convenience tooling. Safe to set to [] on hardened installations.
        type: list
        elements: str
      samba_dc_build_firewall_ssh_sources:
        description: Source networks allowed to reach SSH. Empty list means any source.
        type: list
        elements: str
        default: []
      samba_dc_build_firewall_cockpit_sources:
        description: Source networks allowed to reach Cockpit (9090). Empty list means any source.
        type: list
        elements: str
        default: []
      samba_dc_build_cockpit_install:
        description:
          - How to install cockpit-samba-dc. V(package) installs the Debian
            packages of a release, C(addcctl) (the core the modules of this
            collection call) and C(cockpit-samba-dc) (the Cockpit page),
            checksum verified; V(none) installs C(addcctl) alone; V(source)
            builds both from a git revision on the DC (needs nodejs and npm,
            for development).
        type: str
        choices: [package, source, none]
        default: package
      samba_dc_build_cockpit_version:
        description:
          - Release of cockpit-samba-dc to install with V(package) or V(none),
            as X.Y.Z. Defaults to the version of this collection.
        type: str
        default: "0.8.0"
      samba_dc_build_cockpit_release_url:
        description: Where the packages of the release and their C(.sha256) files are; defaults to the GitHub release.
        type: str
      samba_dc_build_cockpit_package_files:
        description:
          - Debian packages on the controller to install instead of the
            download, for sites without Internet access.
        type: list
        elements: path
        default: []
      samba_dc_build_cockpit_package_dir:
        description: Directory on the DC where the packages are kept.
        type: path
        default: /var/cache/cockpit-samba-dc
      samba_dc_build_cockpit_repo:
        description: Git repository built with O(samba_dc_build_cockpit_install=source).
        type: str
        default: https://github.com/lineadicomando/cockpit-samba-dc.git
      samba_dc_build_cockpit_source_version:
        description: Git revision built with O(samba_dc_build_cockpit_install=source).
        type: str
        default: main
      samba_dc_build_cockpit_src:
        description: Working copy path for a build from source; removed when the package is installed.
        type: path
        default: /usr/local/src/cockpit-samba-dc
