---
- name: Validate backup parameters
  ansible.builtin.assert:
    that:
      - samba_dc_backup_targetdir is none or samba_dc_backup_targetdir is string
      - samba_dc_backup_domain_type in ['online', 'offline']
      - samba_dc_backup_domain or samba_dc_backup_files
    fail_msg: >-
      samba_dc_backup_targetdir must be a path when given, and at least one
      of samba_dc_backup_domain or samba_dc_backup_files must be true.
    quiet: true

# The directory of addcctl's backups unless another is given: an offline
# domain backup there is the one the Cockpit page makes, through addcctl.
- name: Choose the backup directory
  ansible.builtin.set_fact:
    _samba_dc_backup_dir: "{{ (samba_dc_backup_targetdir | default('', true) or samba_dc_backup_addcctl_dir) | regex_replace('/+$', '') }}"

- name: Decide whether addcctl makes the domain backup
  ansible.builtin.set_fact:
    _samba_dc_backup_by_addcctl: >-
      {{ samba_dc_backup_domain | bool
         and samba_dc_backup_domain_type == 'offline'
         and _samba_dc_backup_dir == samba_dc_backup_addcctl_dir }}

# Without a password samba-tool prompts for one and the task hangs, so refuse
# the combination up front.
- name: Require a password when a backup username is given
  ansible.builtin.assert:
    that: samba_dc_backup_domain_password | default('', true) | length > 0
    fail_msg: >-
      samba_dc_backup_domain_username is set, so
      samba_dc_backup_domain_password is required as well.
    quiet: true
  when:
    - samba_dc_backup_domain | bool
    - samba_dc_backup_domain_username | default('', true) | length > 0

- name: Ensure target directory exists
  ansible.builtin.file:
    path: "{{ _samba_dc_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# ── Domain backup ─────────────────────────────────────────────────────────────
- name: Domain backup through addcctl
  when: _samba_dc_backup_by_addcctl | bool
  block:
    - name: Run addcctl backup create
      ansible.builtin.command:
        argv: [addcctl, backup, create]
        stdin: "{}"
      register: _samba_dc_backup_addcctl
      changed_when: true

    - name: Read the backup addcctl made
      ansible.builtin.set_fact:
        samba_dc_backup_domain_result: "{{ _samba_dc_backup_addcctl.stdout | from_json }}"

- name: Domain backup
  when:
    - samba_dc_backup_domain | bool
    - not (_samba_dc_backup_by_addcctl | bool)
  block:
    # The password is deliberately absent from argv: it would be world-readable
    # in /proc for the lifetime of the process, and it would be stored in this
    # fact for the rest of the play. samba-tool reads it from PASSWD instead.
    - name: Build domain backup argv
      ansible.builtin.set_fact:
        _samba_dc_backup_argv: >-
          {{ [samba_dc_backup_bin, 'domain', 'backup', samba_dc_backup_domain_type,
              '--targetdir=' ~ _samba_dc_backup_dir]
             + (['--server=' ~ samba_dc_backup_domain_server]
                if samba_dc_backup_domain_type == 'online' else [])
             + (['-U' ~ samba_dc_backup_domain_username]
                if samba_dc_backup_domain_username | default('', true) | length > 0
                else []) }}

    - name: "Run domain backup ({{ samba_dc_backup_domain_type }})"
      ansible.builtin.command:
        argv: "{{ _samba_dc_backup_argv }}"
      environment: >-
        {{ {'PASSWD': samba_dc_backup_domain_password}
           if samba_dc_backup_domain_password | default('', true) | length > 0
           else {} }}
      register: samba_dc_backup_domain_result
      changed_when: true
      no_log: >-
        {{ samba_dc_backup_no_log | bool
           and samba_dc_backup_domain_password | default('', true) | length > 0 }}

# ── Files backup ──────────────────────────────────────────────────────────────
- name: Files backup
  when: samba_dc_backup_files | bool
  block:
    # now() rather than ansible_date_time, so the role does not depend on facts
    # being gathered.
    - name: Set files archive path
      ansible.builtin.set_fact:
        _samba_dc_backup_files_archive: >-
          {{ _samba_dc_backup_dir }}/files_{{ now(utc=true, fmt='%Y%m%dT%H%M%S') }}.tar.gz

    - name: Archive user files
      community.general.archive:
        path: "{{ samba_dc_backup_files_paths }}"
        dest: "{{ _samba_dc_backup_files_archive }}"
        format: gz
        owner: root
        group: root
        mode: "0600"
      register: samba_dc_backup_files_result
