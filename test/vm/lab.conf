# The test VMs of cockpit-samba-dc: names, network, addresses and sizes, the
# same for anyone who clones the repository. Sourced by env.sh before .env,
# which holds what belongs to one workstation (the passwords, the path of the
# Windows ISO) and may override any of these. A file .env.<host name> (both
# untracked) is read last, for a workstation that differs from the others.

# A libvirt NAT network of the lab's own: the DC serves DNS and Kerberos on
# it, and its addresses do not collide with other projects' VMs.
LAB_NET=cockpit-samba
LAB_BRIDGE=virbr-csamba
LAB_SUBNET=192.168.142                  # /24; .1 is the gateway, DNS forwarder and NTP source
LAB_POOL=default                        # libvirt pool of the disks and media
LAB_TIMEZONE=Europe/Rome

# Domain controller: Debian 13 from the netinst image, then Samba
DC_VM=cockpit-samba-deb13-dc
DC_IP_HOST=20                           # address: LAB_SUBNET.DC_IP_HOST
DC_MAC=52:54:00:5a:dc:20
DC_NAME=dc                              # host name, DC_NAME.DOMAIN_REALM
DC_ADMIN_USER=maint                     # sudo with password; DC_ADMIN_PASSWORD in .env
DC_VCPUS=2
DC_MEM_MIB=2048
DC_DISK_GIB=20
DC_LOCALE=it_IT.UTF-8
DC_KEYMAP=it
DEBIAN_MIRROR=deb.debian.org
# The installer is taken from the mirror over HTTPS, no image to download;
# DEBIAN_ISO in .env installs from a local netinst image instead.
DEBIAN_LOCATION=https://deb.debian.org/debian/dists/trixie/main/installer-amd64/

# Domain provisioned on the DC
DOMAIN_REALM=samba.test
DOMAIN_NETBIOS=SAMBATEST

# Windows client: Windows 11 Enterprise Evaluation (WIN_ISO in .env), joined
WIN_VM=cockpit-samba-win11-pc
WIN_IP_HOST=21
WIN_MAC=52:54:00:5a:dc:21
WIN_COMPUTER_NAME=SAMBA-PC              # NetBIOS: at most 15 characters
WIN_ADMIN_USER=maint                    # local administrator; WIN_ADMIN_PASSWORD in .env
WIN_VCPUS=2
WIN_MEM_MIB=4096
WIN_DISK_GIB=64
# Language of the ISO (Setup refuses another), keyboard, time zone
WIN_LANG=it-IT
WIN_KEYBOARD=0410:00000410
WIN_TIMEZONE="W. Europe Standard Time"
WIN_KEYMAP=it                           # for typing through virsh send-key (win-gui)
